name: Studio Las OS security checks

on:
  pull_request:
    paths:
      - "studio-las-os.html"
      - "studio-management-os-3.0.html"
      - "studio-las-config.js"
      - "assets/os/**"
      - "demo/**"
      - "tools/export-legacy-browser-data.*"
      - "tools/client-access-admin.*"
      - "supabase/config.toml"
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/verify_studio_las_os.py"
      - "scripts/verify_access_lifecycle.py"
      - "scripts/verify_trainer_mfa.py"
      - "scripts/test_trainer_mfa.mjs"
      - "scripts/test_pwd_trainer_workflow.mjs"
      - "scripts/test_session_brief.mjs"
      - "scripts/verify_target_preflight_read_only.py"
      - ".github/workflows/studio-las-os-security-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-las-os-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-security-contract:
    name: Static security contract
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Show runtimes
        run: |
          node --version
          python3 --version
          deno --version

      - name: Parse ES modules
        run: python3 -c "import scripts.verify_studio_las_os as v; v.check_js_syntax()"

      - name: Parse client access admin module
        run: node --input-type=module --check < tools/client-access-admin.js

      - name: Verify module imports
        run: python3 -c "import scripts.verify_studio_las_os as v; v.check_import_targets()"

      - name: Verify production storage boundaries
        run: python3 -c "import scripts.verify_studio_las_os as v; v.check_runtime_boundaries()"

      - name: Verify production and legacy entry points
        run: python3 -c "import scripts.verify_studio_las_os as v; v.check_entrypoints()"

      - name: Verify demo isolation
        run: python3 -c "import scripts.verify_studio_las_os as v; v.check_demo_isolation()"

      - name: Verify legacy export boundary
        run: python3 -c "import scripts.verify_studio_las_os as v; v.check_legacy_export_boundary()"

      - name: Verify module size limits
        run: python3 -c "import scripts.verify_studio_las_os as v; v.check_modularity()"

      - name: Verify security migration contract
        run: python3 -c "import scripts.verify_studio_las_os as v; v.check_security_migration_contract()"

      - name: Verify access lifecycle, audit, and Storage boundaries
        run: python3 scripts/verify_access_lifecycle.py

      - name: Verify trainer TOTP browser flows
        run: node scripts/test_trainer_mfa.mjs

      - name: Verify atomic trainer PWD workflow
        run: node scripts/test_pwd_trainer_workflow.mjs

      - name: Verify Trainer Session Brief composition
        run: node scripts/test_session_brief.mjs

      - name: Verify trainer TOTP / AAL2 contract
        run: python3 scripts/verify_trainer_mfa.py

      - name: Verify target preflight remains read-only
        run: python3 scripts/verify_target_preflight_read_only.py

      - name: Type-check authenticated client access Edge Function
        run: deno check supabase/functions/client-access/index.ts

      - name: Verify complete static contract
        run: python3 scripts/verify_studio_las_os.py
