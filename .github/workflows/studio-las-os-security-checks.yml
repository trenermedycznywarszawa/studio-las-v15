name: Studio Las OS security checks

on:
  pull_request:
    paths:
      - "studio-las-os.html"
      - "studio-management-os-3.0.html"
      - "studio-las-config.js"
      - "assets/os/**"
      - "demo/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/verify_studio_las_os.py"
      - ".github/workflows/studio-las-os-security-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-las-os-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-security-contract:
    name: Static security contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show runtimes
        run: |
          node --version
          python3 --version

      - name: Verify Studio Las OS boundaries
        run: python3 scripts/verify_studio_las_os.py
