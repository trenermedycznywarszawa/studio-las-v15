name: Studio Las backup workflow offline test

on:
  pull_request:
    paths:
      - "scripts/backup_and_verify_target.ps1"
      - "scripts/test_backup_workflow_mock.ps1"
      - "scripts/verify_backup_workflow.py"
      - "docs/deployment/06_TARGET_BACKUP_AND_RESTORE.md"
      - ".gitignore"
      - ".github/workflows/studio-las-backup-offline-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-las-backup-offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-backup-contract:
    name: Offline backup contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show runtimes
        run: |
          python3 --version
          pwsh --version

      - name: Parse PowerShell workflows
        shell: pwsh
        run: |
          $files = @(
            "scripts/backup_and_verify_target.ps1",
            "scripts/test_backup_workflow_mock.ps1"
          )

          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file: $($_.Message)" }
              exit 1
            }
          }

      - name: Verify backup workflow static safety
        run: python3 scripts/verify_backup_workflow.py

      - name: Run fully offline mock dump and restore
        shell: pwsh
        run: ./scripts/test_backup_workflow_mock.ps1
