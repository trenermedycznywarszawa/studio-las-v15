name: Trainer attention production verification
on:
  pull_request:
    paths:
      - 'assets/os/**'
      - 'scripts/*trainer_attention*'
      - 'scripts/*client_contact*'
      - 'scripts/*e2e_safety_gate*'
      - 'scripts/e2e_*.mjs'
      - 'scripts/*isolated_qa_preview*'
      - 'scripts/attention_e2e_helpers.mjs'
      - '.github/workflows/trainer-attention-production.yml'
      - 'supabase/migrations/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-las-browser-e2e-canonical-staging
  cancel-in-progress: false
jobs:
  local-regressions:
    name: Local regressions (no staging mutation)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Required regressions and E2E safety gate offline tests
        run: |
          node --check scripts/e2e_safety_gate.mjs
          node --check scripts/test_e2e_safety_gate.mjs
          node scripts/test_pwd_trainer_workflow.mjs
          node scripts/test_client_process_update.mjs
          node scripts/test_decision_state_integrity.mjs
          node scripts/test_stage2_production_runtime.mjs
          node scripts/test_pre_pwd_v31_registration.mjs
          node scripts/test_trainer_attention_model.mjs
          node scripts/test_trainer_attention_runtime.mjs
          node scripts/test_attention_e2e_helpers.mjs
          node scripts/test_signal_followthrough.mjs
          node scripts/test_client_response_state.mjs
          node scripts/test_client_response_day_rollover.mjs
          node scripts/test_client_contact_requests.mjs
          node scripts/test_trainer_questionnaire.mjs
          node scripts/test_first_guidance.mjs
          node scripts/test_process_history.mjs
          node scripts/test_report_evidence.mjs
          node scripts/test_guidance_integrity_transport.mjs
          node scripts/test_e2e_safety_gate.mjs
          node scripts/test_e2e_qa_target.mjs
          node scripts/test_qa_preview.mjs
          node --check scripts/start_isolated_qa_preview.mjs
          node scripts/test_start_isolated_qa_preview.mjs
      - name: Build staging artifact
        run: node scripts/build_studio_las_os_deploy.mjs --staging
      - name: Report staging E2E status (NOT RUN / BLOCKED)
        if: github.event_name == 'pull_request'
        env:
          STUDIO_LAS_E2E_PROJECT_REF: ulauyoqjoetjqktegeuq
          STUDIO_LAS_E2E_SUPABASE_URL: https://ulauyoqjoetjqktegeuq.supabase.co
          STUDIO_LAS_E2E_URL: http://127.0.0.1:8790/
          STUDIO_LAS_QA_EMAIL: attention.trainer@example.test
          STUDIO_LAS_E2E_MARKER: ATTENTION-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/e2e_safety_gate.mjs --report-only --github-summary

  staging-browser-e2e:
    name: Staging browser E2E (manual dispatch only; fail-closed)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # These settings MUST point to an independently verified disposable QA project.
      # Missing vars/secrets fail before a browser or remote write is attempted.
      STUDIO_LAS_E2E_PROJECT_REF: ${{ vars.STUDIO_LAS_DISPOSABLE_QA_PROJECT_REF }}
      STUDIO_LAS_E2E_SUPABASE_URL: ${{ vars.STUDIO_LAS_DISPOSABLE_QA_SUPABASE_URL }}
      STUDIO_LAS_E2E_PUBLISHABLE_KEY: ${{ secrets.STUDIO_LAS_DISPOSABLE_QA_PUBLISHABLE_KEY }}
      STUDIO_LAS_E2E_ISOLATION_MODE: isolated-disposable
      STUDIO_LAS_E2E_ISOLATION_VERIFIED: ${{ vars.STUDIO_LAS_DISPOSABLE_QA_ISOLATION_VERIFIED }}
      STUDIO_LAS_E2E_CLEANUP_STRATEGY: disposable-environment-teardown
      STUDIO_LAS_E2E_CLEANUP_VERIFIED: ${{ vars.STUDIO_LAS_DISPOSABLE_QA_CLEANUP_VERIFIED }}
      STUDIO_LAS_E2E_VERIFICATION_EVIDENCE: ${{ vars.STUDIO_LAS_DISPOSABLE_QA_VERIFICATION_EVIDENCE }}
      STUDIO_LAS_QA_EMAIL: attention.trainer@example.test
      STUDIO_LAS_QA_PASSWORD: ${{ secrets.STUDIO_LAS_DISPOSABLE_QA_TRAINER_PASSWORD }}
      STUDIO_LAS_ATTENTION_CLIENT_PASSWORD: ${{ secrets.STUDIO_LAS_DISPOSABLE_QA_CLIENT_PASSWORD }}
      STUDIO_LAS_E2E_URL: http://127.0.0.1:8790/
      STUDIO_LAS_E2E_ARTIFACT_DIR: artifacts/attention
      STUDIO_LAS_E2E_MARKER: ATTENTION-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated QA preview (build only, no remote writes)
        run: node scripts/build_studio_las_os_deploy.mjs --qa
      - name: Enforce fail-closed E2E safety gate
        id: gate
        run: node scripts/e2e_safety_gate.mjs --github-output --github-summary
      - name: Verify isolated QA preview after gate
        if: steps.gate.outputs.allowed == 'true' && github.event_name == 'workflow_dispatch'
        run: grep -q '"mode": "qa"' .deploy/studio-las-os/studio-las-config.js
      - name: Install browser runtime
        if: steps.gate.outputs.allowed == 'true' && github.event_name == 'workflow_dispatch'
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start staging preview
        if: steps.gate.outputs.allowed == 'true' && github.event_name == 'workflow_dispatch'
        run: python3 -m http.server 8790 --bind 127.0.0.1 --directory .deploy/studio-las-os > /tmp/attention-server.log 2>&1 &
      - name: Bootstrap temporary MFA
        if: steps.gate.outputs.allowed == 'true' && github.event_name == 'workflow_dispatch'
        run: node scripts/e2e_mfa_bootstrap.mjs bootstrap
      - name: Real staging workflow on desktop and phone
        if: steps.gate.outputs.allowed == 'true' && github.event_name == 'workflow_dispatch'
        run: node scripts/e2e_trainer_attention_flow.mjs
      - name: Independent client questions
        if: steps.gate.outputs.allowed == 'true' && github.event_name == 'workflow_dispatch'
        run: node scripts/e2e_client_contact_requests.mjs
      - name: Questionnaire assignment from trainer UI
        if: steps.gate.outputs.allowed == 'true' && github.event_name == 'workflow_dispatch'
        run: node scripts/e2e_questionnaire_assignment.mjs
      - name: Saved PWD to first guidance
        if: steps.gate.outputs.allowed == 'true' && github.event_name == 'workflow_dispatch'
        run: node scripts/e2e_pwd_first_guidance.mjs
      - name: Process changes and sourced report
        if: steps.gate.outputs.allowed == 'true' && github.event_name == 'workflow_dispatch'
        run: node scripts/e2e_process_report.mjs
      - name: Exhaustive reads and authorization
        if: steps.gate.outputs.allowed == 'true' && github.event_name == 'workflow_dispatch'
        run: node scripts/e2e_trainer_attention_staging.mjs
      - name: Remove temporary MFA
        if: always() && steps.gate.outputs.allowed == 'true' && github.event_name == 'workflow_dispatch'
        run: node scripts/e2e_mfa_bootstrap.mjs cleanup
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.allowed == 'true' && github.event_name == 'workflow_dispatch'
        with:
          name: trainer-attention-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/attention/
          retention-days: 14
